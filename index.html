<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Class Confetti</title>
<meta name="description" content="A cheerful, real-time classroom board for sharing ideas, images, links and PDFs." />
<meta name="theme-color" content="#ffc93c" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎉%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-row-main">
      <button class="btn-ghost exit-room-btn" id="exit-room" hidden title="Back to all classrooms">← Classrooms</button>
      <h1 id="board-title">Loading…</h1>
      <button class="btn-ghost" id="board-title-edit" hidden title="Edit board title">✏️</button>
    </div>
    <div class="header-row-controls">
      <div class="online-status" id="online-status"><span class="online-dot"></span><span id="online-label">Online classroom board</span></div>
      <div class="user-area" id="user-area"></div>
    </div>
  </header>

  <section class="announcement hidden" id="announcement">
    <span class="icon">📢</span>
    <span class="text" id="announcement-text"></span>
    <button class="btn-ghost" id="announcement-edit" hidden>Edit</button>
  </section>

  <section class="toolbar" id="toolbar" hidden>
    <input id="search" type="text" placeholder="Search posts…" />
    <select id="sort">
      <option value="newest">Newest first</option>
      <option value="oldest">Oldest first</option>
      <option value="liked">Most liked</option>
    </select>
    <button class="btn-icon" id="refresh-posts" title="Reconnect & reload posts">↻</button>
  </section>

  <main class="board" id="board"></main>

  <footer class="app-footer">
    Made with <span aria-hidden="true">💛</span> for happy classrooms
  </footer>

  <button class="fab" id="fab" title="Add a post" hidden>+</button>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script>
    // Runs if js/main.js (or the js/config.js it imports) fails to load.
    function showStartupHelp() {
      document.getElementById("board-title").textContent = "Almost there!";
      var board = document.getElementById("board");
      board.textContent = "";
      var box = document.createElement("div");
      box.className = "empty-state";
      var heading = document.createElement("h2");
      heading.textContent = "The app couldn't start";
      var hint = document.createElement("p");
      hint.textContent = "If you just cloned this project, create js/config.js by running \"node scripts/generate-config.mjs\" (it reads your .env file). Otherwise, check your internet connection and reload.";
      box.append(heading, hint);
      board.append(box);
    }
  </script>
  <script type="module" src="js/main.js" onerror="showStartupHelp()"></script>
</body>
</html>
